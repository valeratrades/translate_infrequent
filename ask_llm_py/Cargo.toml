[package]
name = "ask_llm_py"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
ask_llm = { version = "^3", default-features = false }
pyo3 = { version = "=0.30.1", features = ["extension-module", "abi3-py312"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread"] }
